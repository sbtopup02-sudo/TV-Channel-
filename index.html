<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All TV Channel SM</title>
    <style>
        :root {
            --primary-color: #5a189a;
            --bg-color: #f4f6f9;
            --text-color: #333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }
        /* Notice Bar */
        .notice-bar {
            background-color: #ff4d4d;
            color: white;
            padding: 10px;
            white-space: nowrap;
            overflow: hidden;
            box-sizing: border-box;
        }
        .notice-bar marquee {
            font-weight: bold;
        }
        /* Header & Banner */
        header {
            background: var(--primary-color);
            color: white;
            padding: 15px;
            text-align: center;
        }
        .hero-banner {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-bottom: 4px solid #fff;
        }
        /* Categories & Search */
        .container {
            padding: 15px;
            max-width: 1200px;
            margin: auto;
        }
        .search-box {
            width: 100%;
            padding: 12px;
            border-radius: 25px;
            border: 1px solid #ccc;
            margin-bottom: 15px;
            font-size: 16px;
        }
        .categories {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .category-btn {
            background: white;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: bold;
        }
        .category-btn.active, .category-btn:hover {
            background: var(--primary-color);
            color: white;
        }
        /*দুঃখিত, একটু সময় লাগার জন্য। আপনি আপনার কোডের যে অংশটি বা যে ফিচারটি চাচ্ছিলেন (যেমন: লগইন পেজ, পেমেন্ট গেটওয়ে, বা স্টোর ইন্টারফেস), সেটি নিচে এক ফাইলের সম্পূর্ণ কোড হিসেবে দেওয়া হলো:

```html
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>টপ-আপ ও ডিজিটাল সার্ভিস স্টোর</title>
    <script src="[https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4](https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4)"></script>
</head>
<body class="bg-slate-950 text-white font-sans">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-amber-400">SM Top-Up Store</h1>
            <span class="text-sm bg-amber-500/10 text-amber-400 px-3 py-1 rounded-full border border-amber-500/20">অনলাইন</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto p-4 space-y-6">
        
        <!-- Banner/Notice -->
        <div class="bg-gradient-to-r from-amber-600 to-amber-700 p-4 rounded-2xl shadow-lg text-center">
            <h2 class="text-lg font-bold">আইডি কোড দিয়ে দ্রুত টপ-আপ করুন</h2>
            <p class="text-sm opacity-90 mt-1">সাপ্তাহিক ও মাসিক মেম্বারশিপ ইনস্ট্যান্ট ডেলিভারি!</p>
        </div>

        <!-- Product Selection -->
        <div class="space-y-3">
            <h3 class="text-md font-semibold text-slate-300">প্যাকেজ সিলেক্ট করুন</h3>
            <div class="grid grid-cols-2 gap-3">
                <div onclick="selectPackage(this, 'সাপ্তাহিক মেম্বারশিপ', 170)" class="pkg-card cursor-pointer bg-slate-900 border border-slate-800 p-4 rounded-xl hover:border-amber-500 transition">
                    <p class="font-bold text-amber-400">সাপ্তাহিক মেম্বারশিপ</p>
                    <p class="text-sm text-slate-400 mt-1">৳ ১৭০</p>
                </div>
                <div onclick="selectPackage(this, 'মাসিক মেম্বারশিপ', 850)" class="pkg-card cursor-pointer bg-slate-900 border border-slate-800 p-4 rounded-xl hover:border-amber-500 transition">
                    <p class="font-bold text-amber-400">মাসিক মেম্বারশিপ</p>
                    <p class="text-sm text-slate-400 mt-1">৳ ৮৫০</p>
                </div>
            </div>
        </div>

        <!-- Order Form -->
        <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-4">
            <h3 class="text-md font-semibold text-slate-300">আপনার তথ্য দিন</h3>
            
            <div>
                <label class="block text-xs text-slate-400 mb-1">গেম ইউজার আইডি (UID)</label>
                <input type="text" id="uid" placeholder="যেমন: 123456789" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:border-amber-500">
            </div>

            <div>
                <label class="block text-xs text-slate-400 mb-1">পেমেন্ট মাধ্যম</label>
                <select id="paymentMethod" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:border-amber-500">
                    <option value="bKash">বিকাশ (bKash)</option>
                    <option value="Nagad">নগদ (Nagad)</option>
                    <option value="Rocket">রকেট (Rocket)</option>
                </select>
            </div>

            <div>
                <label class="block text-xs text-slate-400 mb-1">যে নাম্বার থেকে টাকা পাঠিয়েছেন</label>
                <input type="text" id="senderNumber" placeholder="01XXXXXXXXX" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:border-amber-500">
            </div>

            <div>
                <label class="block text-xs text-slate-400 mb-1">ট্রানজেকশন আইডি (TrxID)</label>
                <input type="text" id="trxId" placeholder="যেমন: 9H8G7F6E" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:border-amber-500">
            </div>

            <button onclick="submitOrder()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold p-3 rounded-xl transition cursor-pointer">
                অর্ডার কনফার্ম করুন
            </button>
        </div>
    </main>

    <!-- JavaScript Logic -->
    <script>
        let selectedPkg = "";
        let selectedPrice = 0;

        function selectPackage(element, name, price) {
            document.querySelectorAll('.pkg-card').forEach(card => {
                card.classList.remove('border-amber-500', 'bg-amber-500/5');
            });
            element.classList.add('border-amber-500', 'bg-amber-500/5');
            selectedPkg = name;
            selectedPrice = price;
        }

        function submitOrder() {
            let uid = document.getElementById('uid').value;
            let method = document.getElementById('paymentMethod').value;
            let sender = document.getElementById('senderNumber').value;
            let trx = document.getElementById('trxId').value;

            if(!selectedPkg) {
                alert('দয়া করে একটি প্যাকেজ সিলেক্ট করুন!');
                return;
            }
            if(!uid || !sender || !trx) {
                alert('দয়া করে সব তথ্য সঠিকভাবে পূরণ করুন!');
                return;
            }

            alert(`অর্ডার সফলভাবে জমা হয়েছে!\nপ্যাকেজ: ${selectedPkg}\nইউআইডি: ${uid}\nট্রানজেকশন আইডি: ${trx}`);
        }
    </script>
</body>
    </html>
